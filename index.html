<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gems N' Loans Onchain Luxury Terminal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-black text-green-500 font-mono">
    <div id="root"></div>

    <script type="text/babel">
      function App() {
        const [account, setAccount] = React.useState(null);
        const [zkpVerified, setZkpVerified] = React.useState(false);
        const [userTier, setUserTier] = React.useState('NONE');
        const [activeTab, setActiveTab] = React.useState('terminal');
        const [selectedAsset, setSelectedAsset] = React.useState(null);
        const [loanTerm, setLoanTerm] = React.useState('30');
        const [borrowAmount, setBorrowAmount] = React.useState('');
        const [lockedAssets, setLockedAssets] = React.useState([]);
        
        const [logs, setLogs] = React.useState([
          '[INIT] Hyperliquid EVM (Chain ID: 999) pipeline ready.',
          '[SECURITY] 5-layer protocol safeguards armed.',
          '[READY] Awaiting wallet authentication & ZKP verification...'
        ]);

        const availableCourtyardAssets = [
          { id: 'CY-1999-CHARIZARD', name: '1999 Pokémon Base Set Holo Charizard (PSA 9)', floorPrice: '15.0 ETH', maxBorrow: '11.25 ETH' },
          { id: 'CY-2000-PIKACHU', name: '2000 Pokémon 1st Ed Illustrator Pikachu (BGS 9.5)', floorPrice: '8.5 ETH', maxBorrow: '6.37 ETH' },
          { id: 'CY-2002-BLUE-EYES', name: '2002 Yu-Gi-Oh! Blue-Eyes White Dragon (PSA 10)', floorPrice: '12.0 ETH', maxBorrow: '9.00 ETH' }
        ];

        const handleConnectWallet = async () => {
          if (window.ethereum) {
            try {
              const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
              setAccount(accounts[0]);
              setLogs(prev => [...prev, `[WALLET] Connected: ${accounts[0].substring(0, 6)}...${accounts[0].substring(38)}`]);
            } catch (err) {
              setLogs(prev => [...prev, `[ERROR] Connection rejected.`]);
            }
          } else {
            setLogs(prev => [...prev, `[WARNING] No injected Web3 provider detected. Using mock address.`]);
            setAccount('0x71C...392A');
          }
        };

        const handleZkpVerify = () => {
          setZkpVerified(true);
          setUserTier('INSTITUTIONAL');
          setLogs(prev => [
            ...prev,
            '[ZKP] Proof generated successfully via Circom circuit.',
            '[LICENSE] ERC-721 Financial Instrument detected: INSTITUTIONAL TIER (10.0 ETH License unlocked).'
          ]);
        };

        const handleLockCollateral = () => {
          if (!selectedAsset || !borrowAmount) return;
          setLockedAssets([...lockedAssets, { asset: selectedAsset.name, borrowed: borrowAmount, term: loanTerm }]);
          setSelectedAsset(null);
          setBorrowAmount('');
        };

        return (
          <div className="p-6 min-h-screen border-4 border-green-600">
            <header className="border-b border-green-700 pb-4 mb-6 flex justify-between items-center">
              <div>
                <h1 className="text-2xl font-bold tracking-widest text-green-400">[ GEMS N' LOANS ONCHAIN LUXURY TERMINAL ]</h1>
                <p className="text-xs text-green-600">HYPERLIQUID EVM // SECURE CLOSED-LOOP PROTOCOL</p>
              </div>
              <div className="flex gap-3 items-center">
                <span className="px-3 py-1 border border-green-700 text-xs bg-green-950/40">TIER: {userTier}</span>
                {account ? (
                  <span className="px-3 py-1 border border-green-500 text-xs bg-green-900/40 text-green-300">
                    {account.substring(0, 6)}...{account.substring(38)}
                  </span>
                ) : (
                  <button onClick={handleConnectWallet} className="bg-green-700 text-black px-3 py-1 text-xs font-bold hover:bg-green-500">
                    CONNECT WALLET
                  </button>
                )}
              </div>
            </header>

            <div className="flex gap-4 mb-6 border-b border-green-800 pb-2">
              <button onClick={() => setActiveTab('terminal')} className={`px-4 py-1 text-sm font-bold ${activeTab === 'terminal' ? 'bg-green-700 text-black' : 'text-green-500'}`}>// 01. TERMINAL_UI</button>
              <button onClick={() => setActiveTab('vaults')} className={`px-4 py-1 text-sm font-bold ${activeTab === 'vaults' ? 'bg-green-700 text-black' : 'text-green-500'}`}>// 02. ORACLE_VAULTS</button>
              <button onClick={() => setActiveTab('courtyard')} className={`px-4 py-1 text-sm font-bold ${activeTab === 'courtyard' ? 'bg-green-700 text-black' : 'text-green-500'}`}>// 03. OPENSEA_COURTYARD_COLLATERAL</button>
            </div>

            {activeTab === 'terminal' && (
              <main className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="space-y-6">
                  <div className="border border-green-800 p-4 bg-green-950/20">
                    <h2 className="text-sm font-bold border-b border-green-800 pb-2 mb-3 text-green-400">&gt;&gt; THE CLOSED-LOOP FLYWHEEL</h2>
                    <p className="text-xs text-green-300 font-semibold">"DIGITAL → TOKENIZE → VELOCITY → YIELD → NFT → REPEAT"</p>
                  </div>
                  <div className="border border-green-800 p-4 bg-green-950/20">
                    <h2 className="text-sm font-bold border-b border-green-800 pb-2 mb-3 text-green-400">&gt;&gt; ERC-721 ZKP IDENTITY GATE</h2>
                    <button onClick={handleZkpVerify} disabled={zkpVerified} className={`w-full py-2 text-xs font-bold ${zkpVerified ? 'bg-green-950 text-green-700 border border-green-900' : 'bg-green-700 text-black hover:bg-green-500'}`}>
                      {zkpVerified ? '[ LICENSE GATED & VERIFIED ]' : 'EXECUTE ZKP LICENSE PROOF'}
                    </button>
                  </div>
                </div>
                <div className="lg:col-span-2">
                  <div className="border border-green-800 p-4 bg-black h-[320px] overflow-y-auto space-y-2">
                    <h2 className="text-sm font-bold border-b border-green-800 pb-2 mb-3 text-green-400">&gt;&gt; LIVE TERMINAL OUTPUT LOGS</h2>
                    {logs.map((log, i) => <div key={i} className="text-xs text-green-400">&gt; {log}</div>)}
                  </div>
                </div>
              </main>
            )}

            {activeTab === 'vaults' && (
              <main className="border border-green-800 p-6 bg-green-950/10">
                <h2 className="text-lg font-bold mb-4 text-green-400">&gt;&gt; ORACLE-BACKED LENDING VAULTS</h2>
                <div className="grid grid-cols-3 gap-4">
                  <div className="border border-green-800 p-4 bg-black"><h3 className="text-sm font-bold text-green-300">STANDARD TIER</h3><p className="text-xs text-green-400 mt-3">Max Borrow: 50 ETH</p></div>
                  <div className="border border-green-800 p-4 bg-black"><h3 className="text-sm font-bold text-green-300">PRO TIER</h3><p className="text-xs text-green-400 mt-3">Max Borrow: 250 ETH</p></div>
                  <div className="border border-green-800 p-4 bg-black border-green-500"><h3 className="text-sm font-bold text-green-300">INSTITUTIONAL</h3><p className="text-xs text-green-400 mt-3">Max Borrow: 500+ ETH</p></div>
                </div>
              </main>
            )}

            {activeTab === 'courtyard' && (
              <div className="border border-green-800 p-6 bg-green-950/10 space-y-6">
                <h2 className="text-lg font-bold text-green-400">&gt;&gt; COURTYARD.IO COLLATERAL DEPOSIT TERMINAL</h2>
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="space-y-3">
                    <h3 className="text-sm font-bold text-green-300">&gt;&gt; DETECTED COURTYARD NFTS (OPENSEA)</h3>
                    {availableCourtyardAssets.map((asset) => (
                      <div key={asset.id} onClick={() => setSelectedAsset(asset)} className={`p-3 border cursor-pointer ${selectedAsset?.id === asset.id ? 'border-green-400 bg-green-900/30' : 'border-green-900 bg-black'}`}>
                        <p className="text-xs font-bold">{asset.name}</p>
                        <div className="flex justify-between text-[11px] text-green-600 mt-2">
                          <span>Floor: {asset.floorPrice}</span><span>Max LTV: {asset.maxBorrow}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div className="border border-green-800 p-4 bg-black space-y-4">
                    <h3 className="text-sm font-bold text-green-300">&gt;&gt; LOAN ORIGINATION PARAMS</h3>
                    {selectedAsset ? (
                      <div className="space-y-3 text-xs">
                        <div className="p-2 border border-green-900 bg-green-950/20 text-green-300">Selected: {selectedAsset.name}</div>
                        <input type="number" value={borrowAmount} onChange={(e) => setBorrowAmount(e.target.value)} placeholder="Borrow Amount in ETH" className="w-full bg-black border border-green-800 p-2 text-green-400" />
                        <button onClick={handleLockCollateral} className="w-full py-2 bg-green-700 text-black font-bold">LOCK COLLATERAL &amp; MINT LOAN</button>
                      </div>
                    ) : <p className="text-xs text-green-700 italic text-center py-12">Select an OpenSea Courtyard asset.</p>}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
